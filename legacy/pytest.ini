[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests
pythonpath = .
markers =
    unit: Unit tests for components
    integration: Integration tests across subsystems
    edge_case: Edge case tests from specification matrix
    performance: Performance, latency P99 and throughput tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
