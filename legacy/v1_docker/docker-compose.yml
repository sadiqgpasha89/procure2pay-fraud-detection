version: '3.8'

services:
  # FastAPI Scoring Gateway (<850ms SLA)
  fraud-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secret_password
      - STREAM_BUS_TYPE=memory
      - FEATURE_STORE_TYPE=memory
      - WORM_LEDGER_TYPE=file
      - LOCAL_WORM_LEDGER_PATH=/app/data/worm_audit_ledger.jsonl
    volumes:
      - audit-data:/app/data
    depends_on:
      - redis
      - neo4j
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Online Low-Latency Feature Store (<5ms)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Graph Database for Entity Link & Collusion Detection
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/secret_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data

volumes:
  redis-data:
  neo4j-data:
  audit-data:
